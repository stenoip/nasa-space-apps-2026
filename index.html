<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.33.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.33.0/mapbox-gl.js"></script>
    <title>Mars Scouts</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    
    <div id="map"></div>
    <main>
        
        <header>
            <!-- Will change to danger label in case of a dust storm-->
             <img src="assets/magic-wand-icon.png" id="ai-icon">
            <input id="ask-ai" placeholder="Ask Assistant">
        </header>
        
        <section id="sidebar">
            <!-- Spectral / Mineralogy Layer -->
            <img src="assets/mineral.png" class="nav-btn" id="spectral-btn" title="Toggle Spectral/Mineralogy Layer">

            

            <!-- Ice Meter -->
            <img src="assets/ice.png" class="nav-btn" id="ice-btn">

            <!-- Thermal/Albedo Layer -->
            <img src="assets/thermal.png" class="nav-btn" id="thermal-btn" title="Toggle Thermal/Albedo Layer">

            <!--Communication with Astronaut's Team  
            <img src="assets/people.png" class="nav-btn">

            -->

            <!--About -->
            <img src="assets/question.png" class="nav-btn" id="ques-btn">
        </section>
       
        <section id="status">Status Bar</section>


        <div id="about-box">
            <h1>About MarsScouts</h1>
            <p>Made by Amar'e Annan</p>
            <p>View more details about this project on: <a href="https://github.com/stenoip/nasa-space-apps-2026/blob/main/README.md">Github</a></p>
        </div>

        <div id="ice-info">
            <h1 id="ice-info-title">Scouter</h1>
            <p></p>
        </div>
          
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script src="jquery.min.js"></script>
        
        <script src="script.js"></script>
        <script src="ai.js"></script>
        
    </main>
</body>
</html>
